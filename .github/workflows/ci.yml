name: CI

# Fast checks on every push and pull request: install, CLI smoke test, lint for errors, unit tests.
# The data -> predict -> benchmark run lives in e2e.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_CPP_MIN_LOG_LEVEL: "2"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # setup.py pins tensorflow>=2.14,<2.16, which has wheels for Python 3.9-3.11
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install system dependencies
        # pybedtools calls the bedtools binary
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bedtools

      - name: Install quant-maxATAC
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest flake8

      - name: CLI smoke test
        run: |
          maxatac -h
          for command in data predict benchmark threshold train; do
            maxatac "$command" -h > /dev/null
          done

      - name: Lint (errors only)
        # Syntax errors and undefined names; style is not enforced
        run: flake8 maxatac tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Unit tests
        # The other test modules need the v1 inputs that tests/run_tests.sh downloads into tests/temp
        run: pytest -v tests/test_benchmark.py tests/test_parser.py
